<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Player - Viral & Trending</title>
  <meta name="description" content="Nonton video viral, trending, live, dan populer">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg-primary: #0a0a0a;
      --bg-secondary: #141414;
      --bg-card: #1a1a1a;
      --accent: #ff4757;
      --accent-hover: #ff6b7a;
      --text-primary: #ffffff;
      --text-secondary: #a0a0a0;
      --border: #2a2a2a;
      --success: #2ed573;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ==================== HEADER ==================== */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(10, 10, 10, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--accent), #ff6b7a);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
    }

    .logo-text span {
      color: var(--accent);
    }

    .nav-links {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .nav-links a {
      color: var(--text-secondary);
      text-decoration: none;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.2s;
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: var(--text-primary);
      background: var(--bg-secondary);
    }

    /* ==================== MAIN ==================== */
    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 1.5rem;
    }

    .page-title {
      margin-bottom: 1.5rem;
    }

    .page-title h1 {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 0.3rem;
    }

    .page-title p {
      color: var(--text-secondary);
      font-size: 0.95rem;
    }

    /* ==================== VIDEO CONTAINER ==================== */
    .video-container {
      position: relative;
      background: var(--bg-card);
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border);
      aspect-ratio: 9 / 16;
      max-height: 80vh;
      margin: 0 auto;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    .video-container video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      display: block;
    }

    /* Loading State */
    .loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg-card);
      gap: 1rem;
      z-index: 10;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading p {
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    /* Error State */
    .error-state {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg-card);
      gap: 1rem;
      padding: 2rem;
      text-align: center;
      z-index: 10;
    }

    .error-state.show {
      display: flex;
    }

    .error-icon {
      font-size: 3rem;
    }

    .error-state h3 {
      font-size: 1.2rem;
      font-weight: 700;
    }

    .error-state p {
      color: var(--text-secondary);
      font-size: 0.9rem;
      max-width: 300px;
    }

    /* ==================== CONTROLS ==================== */
    .controls {
      display: flex;
      gap: 0.75rem;
      margin-top: 1.5rem;
      flex-wrap: wrap;
    }

    .btn {
      flex: 1;
      min-width: 140px;
      padding: 0.9rem 1.5rem;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.2s;
      font-family: inherit;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #ff6b7a);
      color: white;
      box-shadow: 0 4px 15px rgba(255, 71, 87, 0.3);
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(255, 71, 87, 0.5);
    }

    .btn-primary:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn-secondary {
      background: var(--bg-card);
      color: var(--text-primary);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover:not(:disabled) {
      background: var(--bg-secondary);
      border-color: #3a3a3a;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* ==================== INFO PANEL ==================== */
    .info-panel {
      margin-top: 1.5rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
    }

    .info-panel h3 {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-secondary);
      margin-bottom: 0.75rem;
    }

    .url-box {
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem;
      font-family: 'Courier New', monospace;
      font-size: 0.8rem;
      color: var(--success);
      word-break: break-all;
      line-height: 1.5;
    }

    .url-box.empty {
      color: var(--text-secondary);
      font-style: italic;
    }

    /* ==================== FOOTER ==================== */
    footer {
      text-align: center;
      padding: 2rem 1.5rem;
      color: var(--text-secondary);
      font-size: 0.85rem;
      border-top: 1px solid var(--border);
      margin-top: 3rem;
    }

    footer span {
      color: var(--accent);
    }

    /* ==================== RESPONSIVE ==================== */
    @media (max-width: 640px) {
      header { padding: 0.85rem 1rem; }
      .logo { font-size: 1.1rem; }
      .logo-icon { width: 32px; height: 32px; }
      .nav-links a { padding: 0.4rem 0.75rem; font-size: 0.85rem; }
      main { padding: 1rem; }
      .page-title h1 { font-size: 1.5rem; }
      .video-container { border-radius: 12px; }
      .btn { padding: 0.8rem 1rem; font-size: 0.9rem; }
    }

    /* ==================== TOAST ==================== */
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 0.9rem 1.5rem;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 500;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
      opacity: 0;
      transition: all 0.3s;
      z-index: 1000;
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .toast.success { border-color: var(--success); }
    .toast.error { border-color: var(--accent); }
  </style>
</head>
<body>

  <!-- ==================== HEADER ==================== -->
  <header>
    <div class="logo">
      <div class="logo-icon">🎬</div>
      <div class="logo-text">Vid<span>Play</span></div>
    </div>
    <nav class="nav-links">
      <a href="/" class="active">Home</a>
      <a href="/film">Film</a>
    </nav>
  </header>

  <!-- ==================== MAIN ==================== -->
  <main>
    <div class="page-title">
      <h1>Video Player</h1>
      <p>Nonton video viral, trending, live & populer</p>
    </div>

    <!-- Video Container -->
    <div class="video-container">
      <!-- Loading -->
      <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>Memuat video...</p>
      </div>

      <!-- Error -->
      <div class="error-state" id="errorState">
        <div class="error-icon">😕</div>
        <h3>Gagal Memuat Video</h3>
        <p id="errorMsg">Terjadi kesalahan saat mengambil video.</p>
      </div>

      <!-- Video -->
      <video
        id="videoPlayer"
        controls
        playsinline
        preload="metadata"
        controlsList="nodownload"
        style="display:none;"
      ></video>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="btn btn-primary" id="btnRandom">
        🎲 <span>Video Random</span>
      </button>
      <button class="btn btn-secondary" id="btnCopy">
        📋 <span>Copy URL</span>
      </button>
    </div>

    <!-- Info Panel -->
    <div class="info-panel">
      <h3>URL Video</h3>
      <div class="url-box empty" id="urlBox">Belum ada video yang dimuat</div>
    </div>
  </main>

  <!-- ==================== FOOTER ==================== -->
  <footer>
    © 2025 <span>VidPlay</span> — All rights reserved
  </footer>

  <!-- ==================== TOAST ==================== -->
  <div class="toast" id="toast"></div>

  <!-- ==================== SCRIPT ==================== -->
  <script>
    // ==================== ELEMENTS ====================
    const videoPlayer = document.getElementById('videoPlayer');
    const loading     = document.getElementById('loading');
    const errorState  = document.getElementById('errorState');
    const errorMsg    = document.getElementById('errorMsg');
    const urlBox      = document.getElementById('urlBox');
    const btnRandom   = document.getElementById('btnRandom');
    const btnCopy     = document.getElementById('btnCopy');
    const toast       = document.getElementById('toast');

    let currentUrl = '';

    // ==================== TOAST ====================
    function showToast(message, type = 'success') {
      toast.textContent = message;
      toast.className = 'toast show ' + type;
      clearTimeout(toast._timer);
      toast._timer = setTimeout(() => {
        toast.classList.remove('show');
      }, 2500);
    }

    // ==================== UI STATE ====================
    function showLoading() {
      loading.style.display = 'flex';
      errorState.classList.remove('show');
      videoPlayer.style.display = 'none';
    }

    function showError(msg) {
      loading.style.display = 'none';
      errorState.classList.add('show');
      errorMsg.textContent = msg || 'Terjadi kesalahan saat mengambil video.';
      videoPlayer.style.display = 'none';
    }

    function showVideo(url) {
      loading.style.display = 'none';
      errorState.classList.remove('show');
      videoPlayer.style.display = 'block';
      videoPlayer.src = url;
      videoPlayer.load();
      videoPlayer.play().catch(() => {
        // Autoplay diblokir browser, user harus klik play manual
      });
    }

    // ==================== FETCH VIDEO ====================
    async function fetchVideo() {
      showLoading();
      btnRandom.disabled = true;
      urlBox.textContent = 'Memuat...';
      urlBox.classList.remove('empty');

      try {
        const res = await fetch('/api/video', {
          method: 'GET',
          headers: { 'Accept': 'application/json' }
        });

        if (!res.ok) {
          throw new Error(`HTTP ${res.status}`);
        }

        const data = await res.json();

        if (!data.status || !data.Url_Videos) {
          showError(data.msg || 'Video tidak ditemukan');
          urlBox.textContent = data.msg || 'Video tidak ditemukan';
          urlBox.classList.add('empty');
          return;
        }

        currentUrl = data.Url_Videos;
        urlBox.textContent = currentUrl;
        urlBox.classList.remove('empty');

        showVideo(currentUrl);
        showToast('✅ Video berhasil dimuat', 'success');

      } catch (err) {
        console.error('Fetch error:', err);
        showError('Gagal terhubung ke server. Coba lagi.');
        urlBox.textContent = 'Gagal memuat';
        urlBox.classList.add('empty');
        showToast('❌ ' + err.message, 'error');
      } finally {
        btnRandom.disabled = false;
      }
    }

    // ==================== COPY URL ====================
    async function copyUrl() {
      if (!currentUrl) {
        showToast('⚠️ Belum ada URL untuk di-copy', 'error');
        return;
      }

      try {
        await navigator.clipboard.writeText(currentUrl);
        showToast('📋 URL berhasil di-copy!', 'success');
      } catch {
        // Fallback untuk browser lama
        const textarea = document.createElement('textarea');
        textarea.value = currentUrl;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        showToast('📋 URL berhasil di-copy!', 'success');
      }
    }

    // ==================== EVENT LISTENERS ====================
    btnRandom.addEventListener('click', fetchVideo);
    btnCopy.addEventListener('click', copyUrl);

    // Auto load saat halaman dibuka
    window.addEventListener('DOMContentLoaded', fetchVideo);
  </script>
</body>
</html>
