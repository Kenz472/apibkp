<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Nsfw Premium</title>
  <meta name="description" content="Nonton video viral, trending, live, dan populer">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg-primary: #0a0a0a;
      --bg-secondary: #141414;
      --bg-card: #1a1a1a;
      --accent: #ff4757;
      --accent-hover: #ff6b7a;
      --text-primary: #ffffff;
      --text-secondary: #a0a0a0;
      --border: #2a2a2a;
      --success: #2ed573;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(10, 10, 10, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--accent), #ff6b7a);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
    }

    .logo-text span {
      color: var(--accent);
    }

    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 1.5rem;
    }

    .page-title {
      margin-bottom: 1.5rem;
    }

    .page-title h1 {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 0.3rem;
    }

    .page-title p {
      color: var(--text-secondary);
      font-size: 0.95rem;
    }

    .video-container {
      position: relative;
      background: var(--bg-card);
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border);
      aspect-ratio: 9 / 16;
      max-height: 80vh;
      margin: 0 auto;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    .video-container video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      display: block;
    }

    .loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg-card);
      gap: 1rem;
      z-index: 10;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading p {
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .error-state {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg-card);
      gap: 1rem;
      padding: 2rem;
      text-align: center;
      z-index: 10;
    }

    .error-state.show {
      display: flex;
    }

    .error-icon {
      font-size: 3rem;
    }

    .error-state h3 {
      font-size: 1.2rem;
      font-weight: 700;
    }

    .error-state p {
      color: var(--text-secondary);
      font-size: 0.9rem;
      max-width: 300px;
    }

    .controls {
      display: flex;
      gap: 0.75rem;
      margin-top: 1.5rem;
      flex-wrap: wrap;
    }

    .btn {
      flex: 1;
      min-width: 140px;
      padding: 0.9rem 1.5rem;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.2s;
      font-family: inherit;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #ff6b7a);
      color: white;
      box-shadow: 0 4px 15px rgba(255, 71, 87, 0.3);
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(255, 71, 87, 0.5);
    }

    .btn-primary:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn-secondary {
      background: var(--bg-card);
      color: var(--text-primary);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover:not(:disabled) {
      background: var(--bg-secondary);
      border-color: #3a3a3a;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .info-panel {
      margin-top: 1.5rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
    }

    .info-panel h3 {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-secondary);
      margin-bottom: 0.75rem;
    }

    .url-box {
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem;
      font-family: 'Courier New', monospace;
      font-size: 0.8rem;
      color: var(--success);
      word-break: break-all;
      line-height: 1.5;
    }

    .url-box.empty {
      color: var(--text-secondary);
      font-style: italic;
    }

    footer {
      text-align: center;
      padding: 2rem 1.5rem;
      color: var(--text-secondary);
      font-size: 0.85rem;
      border-top: 1px solid var(--border);
      margin-top: 3rem;
    }

    footer span {
      color: var(--accent);
    }

    @media (max-width: 640px) {
      header { padding: 0.85rem 1rem; }
      .logo { font-size: 1rem; }
      .logo-icon { width: 32px; height: 32px; }
      main { padding: 1rem; }
      .page-title h1 { font-size: 1.5rem; }
      .video-container { border-radius: 12px; }
      .btn { padding: 0.8rem 1rem; font-size: 0.9rem; }
    }

    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 0.9rem 1.5rem;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 500;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
      opacity: 0;
      transition: all 0.3s;
      z-index: 1000;
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .toast.success { border-color: var(--success); }
    .toast.error { border-color: var(--accent); }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <div class="logo-icon">🎬</div>
      <div class="logo-text">Video <span>Nsfw</span> Premium</div>
    </div>
  </header>

  <main>
    <div class="page-title">
      <h1>Video Player</h1>
      <p>Nonton video viral, trending, live & populer</p>
    </div>

    <div class="video-container">
      <div class="loading" id="loading">
        <div class="spinner"></div>
        <p id="loadingText">Memuat video...</p>
      </div>

      <div class="error-state" id="errorState">
        <div class="error-icon">😕</div>
        <h3>Gagal Memuat Video</h3>
        <p id="errorMsg">Terjadi kesalahan saat mengambil video.</p>
      </div>

      <video
        id="videoPlayer"
        controls
        playsinline
        preload="metadata"
        controlsList="nodownload"
        style="display:none;"
      ></video>
    </div>

    <div class="controls">
      <button class="btn btn-primary" id="btnRandom">
        🎲 <span>Video Random</span>
      </button>
      <button class="btn btn-secondary" id="btnCopy">
        📋 <span>Copy URL</span>
      </button>
    </div>

    <div class="info-panel">
      <h3>URL Video</h3>
      <div class="url-box empty" id="urlBox">Belum ada video yang dimuat</div>
    </div>
  </main>

  <footer>
    © 2025 <span>Video Nsfw Premium</span> — All rights reserved
  </footer>

  <div class="toast" id="toast"></div>

  <script>
    const videoPlayer = document.getElementById('videoPlayer');
    const loading     = document.getElementById('loading');
    const loadingText = document.getElementById('loadingText');
    const errorState  = document.getElementById('errorState');
    const errorMsg    = document.getElementById('errorMsg');
    const urlBox      = document.getElementById('urlBox');
    const btnRandom   = document.getElementById('btnRandom');
    const btnCopy     = document.getElementById('btnCopy');
    const toast       = document.getElementById('toast');

    let currentUrl = '';

    const PROXIES = [
      {
        name: 'rifkyshre',
        build: (url) => `https://cors.rifkyshre.biz.id/${url}`
      },
      {
        name: 'uncors',
        build: (url) => `https://uncors.netlify.app/?destination=${encodeURIComponent(url)}`
      }
    ];

    function showToast(message, type = 'success') {
      toast.textContent = message;
      toast.className = 'toast show ' + type;
      clearTimeout(toast._timer);
      toast._timer = setTimeout(() => {
        toast.classList.remove('show');
      }, 2500);
    }

    function showLoading(text = 'Memuat video...') {
      loading.style.display = 'flex';
      loadingText.textContent = text;
      errorState.classList.remove('show');
      videoPlayer.style.display = 'none';
    }

    function showError(msg) {
      loading.style.display = 'none';
      errorState.classList.add('show');
      errorMsg.textContent = msg || 'Terjadi kesalahan saat mengambil video.';
      videoPlayer.style.display = 'none';
    }

    function showVideo(url) {
      loading.style.display = 'none';
      errorState.classList.remove('show');
      videoPlayer.style.display = 'block';
      videoPlayer.src = url;
      videoPlayer.load();
      videoPlayer.play().catch(() => {});
    }

    function generateRandomString(length) {
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
      let result = '';
      for (let i = 0; i < length; i++) {
        result += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return result;
    }

    async function fetchWithFallback(targetUrl) {
      let lastError = null;

      for (let i = 0; i < PROXIES.length; i++) {
        const proxy = PROXIES[i];
        const proxyUrl = proxy.build(targetUrl);
        try {
          showLoading(`Mencoba proxy ${proxy.name}...`);
          console.log(`[Proxy ${i + 1}/${PROXIES.length}] ${proxy.name} → ${proxyUrl}`);

          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 25000);

          const res = await fetch(proxyUrl, {
            method: 'GET',
            signal: controller.signal,
            headers: {
              'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8'
            }
          });

          clearTimeout(timeoutId);

          if (!res.ok) {
            throw new Error(`HTTP ${res.status}`);
          }

          const html = await res.text();
          console.log(`[Proxy ${proxy.name}] Berhasil (${html.length} bytes)`);
          return html;

        } catch (err) {
          console.warn(`[Proxy ${proxy.name}] Gagal:`, err.message);
          lastError = err;
        }
      }

      throw new Error('Semua proxy gagal. Coba lagi nanti.');
    }

    function extractVideoUrl(html) {
      let videoUrl = null;

      try {
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');

        const sources = doc.querySelectorAll('source');
        for (const s of sources) {
          const src = s.getAttribute('src');
          if (src && /\.mp4/i.test(src)) { videoUrl = src; break; }
        }

        if (!videoUrl) {
          const videos = doc.querySelectorAll('video');
          for (const v of videos) {
            const src = v.getAttribute('src');
            if (src && /\.mp4/i.test(src)) { videoUrl = src; break; }
          }
        }
      } catch (e) {
        console.warn('DOMParser gagal, fallback ke regex');
      }

      if (!videoUrl) {
        const match = html.match(/<source[^>]+src=["']([^"']+\.mp4)["']/i)
                   || html.match(/<video[^>]+src=["']([^"']+\.mp4)["']/i)
                   || html.match(/["'](https?:\/\/[^"']+\.mp4)["']/i);
        if (match) videoUrl = match[1];
      }

      return videoUrl;
    }

    async function fetchVideo() {
      btnRandom.disabled = true;
      btnCopy.disabled = true;
      showLoading('Menyiapkan...');
      urlBox.textContent = 'Memuat...';
      urlBox.classList.remove('empty');

      try {
        const urlList = [
          'https://viday.uk/v/viral',
          'https://viday.uk/v/trending',
          'https://viday.uk/v/live',
          'https://viday.uk/v/populer'
        ];

        const base = urlList[Math.floor(Math.random() * urlList.length)];
        const id = generateRandomString(10);
        const targetUrl = `${base}=${id}`;

        console.log('Target:', targetUrl);

        const html = await fetchWithFallback(targetUrl);
        const videoUrl = extractVideoUrl(html);

        if (!videoUrl) {
          throw new Error('Video URL tidak ditemukan di halaman');
        }

        currentUrl = videoUrl;
        urlBox.textContent = currentUrl;
        urlBox.classList.remove('empty');

        showVideo(currentUrl);
        showToast('Video berhasil dimuat', 'success');

      } catch (err) {
        console.error('Fetch error:', err);
        showError(err.message || 'Gagal memuat video.');
        urlBox.textContent = 'Gagal memuat';
        urlBox.classList.add('empty');
        showToast(err.message, 'error');
      } finally {
        btnRandom.disabled = false;
        btnCopy.disabled = false;
      }
    }

    async function copyUrl() {
      if (!currentUrl) {
        showToast('Belum ada URL untuk di-copy', 'error');
        return;
      }

      try {
        await navigator.clipboard.writeText(currentUrl);
        showToast('URL berhasil di-copy!', 'success');
      } catch {
        const textarea = document.createElement('textarea');
        textarea.value = currentUrl;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        showToast('URL berhasil di-copy!', 'success');
      }
    }

    btnRandom.addEventListener('click', fetchVideo);
    btnCopy.addEventListener('click', copyUrl);

    window.addEventListener('DOMContentLoaded', fetchVideo);
  </script>
</body>
</html>
